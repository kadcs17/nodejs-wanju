version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs-wanju-app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    volumes:
      - ./index.js:/app/index.js
      - ./package.json:/app/package.json
    networks:
      - wanju-network

networks:
  wanju-network:
    driver: bridge
